[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "near-target-astigmatism-analysis"
version = "1.0.1"
description = "Frozen release replay and independent reconstruction of the primary estimate for residual astigmatism and toric IOL correction in near-targeted cataract surgery"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Hitoshi Tabuchi"},
  {name = "Tomohiro Shojo"},
  {name = "Tomofusa Yamauchi"},
  {name = "Fumi Gomi"}
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "statsmodels>=0.14,<1",
  "scikit-learn>=1.4,<2",
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
  "matplotlib>=3.8,<4"
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
near-target-pipeline = "near_target_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "private_data: requires the non-public source Excel workbooks",
  "slow: relatively slow end-to-end analysis"
]
addopts = "-ra"
